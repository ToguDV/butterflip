<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Sandbox font config for headless screenshots</description>

  <dir>/tmp/sysroot/usr/share/fonts</dir>
  <dir>~/.fonts</dir>

  <include ignore_missing="no">/tmp/shot/conf.d</include>

  <cachedir>/tmp/fontcache</cachedir>

  <!-- Generic families used by the app -->
  <match target="pattern">
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
